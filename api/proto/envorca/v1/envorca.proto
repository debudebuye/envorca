syntax = "proto3";

package envorca.v1;

option go_package = "envorca.dev/envorca/api/gen/go/envorca/v1;envorcav1";

// Daemon is the single Envorca service. It is the only owner of
// infrastructure state and logic; CLI and desktop are thin clients.
service Daemon {
  // Ping returns daemon identity and liveness.
  rpc Ping(PingRequest) returns (PingResponse);
  // GetStatus returns the full environment status snapshot.
  rpc GetStatus(GetStatusRequest) returns (EnvironmentStatus);
  // GetRepairPlan lists safe repairs available for the current state.
  rpc GetRepairPlan(GetRepairPlanRequest) returns (RepairPlan);
  // ExecuteRepair runs a repair action. Destructive actions require
  // confirmed = true.
  rpc ExecuteRepair(ExecuteRepairRequest) returns (RepairOutcome);
  // StreamEvents streams daemon events: the retained replay buffer first
  // (when replay = true), then live events until the client disconnects.
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  // GetDiagnostics returns recently recorded diagnostic snapshots.
  rpc GetDiagnostics(GetDiagnosticsRequest) returns (GetDiagnosticsResponse);
  // GetRepairHistory returns recently recorded repair outcomes.
  rpc GetRepairHistory(GetRepairHistoryRequest) returns (GetRepairHistoryResponse);
  // Shutdown requests a graceful daemon stop.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  HEALTHY = 1;
  WARNING = 2;
  CRITICAL = 3;
  UNKNOWN = 4;
}

message PingRequest {}

message PingResponse {
  string version = 1;
  string daemon_state = 2; // running | stopping
  int64 uptime_seconds = 3;
  string socket = 4;
}

message ComponentStatus {
  string id = 1;
  Status status = 2;
  string summary = 3;
  string reason = 4;
  string recommendation = 5;
  bool safe_to_fix = 6;
  bool requires_confirmation = 7;
}

message GetStatusRequest {}

message EnvironmentStatus {
  string version = 1;
  string daemon_state = 2;
  int64 uptime_seconds = 3;
  string socket = 4;
  Status overall_status = 5;
  repeated ComponentStatus components = 6;
}

message GetRepairPlanRequest {}

message RepairAction {
  string component_id = 1;
  string action_id = 2;
  string summary = 3;
  string description = 4;
  bool safe = 5;
  bool requires_confirmation = 6;
}

message RepairPlan {
  repeated RepairAction actions = 1;
  string evaluated_at = 2; // RFC3339 UTC
}

message ExecuteRepairRequest {
  string action_id = 1;
  bool confirmed = 2;
}

message RepairOutcome {
  string action_id = 1;
  string component_id = 2;
  bool success = 3;
  string result = 4;
  string verification = 5;
}

message StreamEventsRequest {
  // replay controls whether the daemon's retained event buffer is sent
  // before live events. Defaults to true.
  bool replay = 1;
}

message Event {
  uint64 seq = 1;        // monotonically increasing daemon-wide sequence
  string timestamp = 2;  // RFC3339 UTC
  string level = 3;      // debug | info | warn | error
  string component = 4;  // daemon | recovery | wsl | ...
  string name = 5;       // event name, e.g. started, repair_executed
  string project = 6;
  map<string, string> fields = 7;
}

message GetDiagnosticsRequest {
  int32 limit = 1; // max records to return (default 20, clamped to [1,500])
}

message DiagnosticRecord {
  string performed_at = 1; // RFC3339 UTC
  string overall_status = 2;
  string payload = 3;      // JSON-encoded EnvironmentStatus snapshot
}

message GetDiagnosticsResponse {
  repeated DiagnosticRecord diagnostics = 1;
}

message GetRepairHistoryRequest {
  int32 limit = 1; // max records to return (default 20, clamped to [1,500])
}

message RepairRecord {
  string performed_at = 1; // RFC3339 UTC
  string action_id = 2;
  string component_id = 3;
  bool success = 4;
  string result = 5;
  string verification = 6;
}

message GetRepairHistoryResponse {
  repeated RepairRecord repairs = 1;
}

message ShutdownRequest {}
message ShutdownResponse {}