<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0d2137"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="orca-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00b4d8" flood-opacity="0.4"/>
    </filter>
    <filter id="textglow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00b4d8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid lines -->
  <g stroke="#0e3a5c" stroke-width="0.3" opacity="0.3">
    <line x1="0" y1="75" x2="900" y2="75"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="225" x2="900" y2="225"/>
    <line x1="225" y1="0" x2="225" y2="300"/>
    <line x1="450" y1="0" x2="450" y2="300"/>
    <line x1="675" y1="0" x2="675" y2="300"/>
  </g>

  <!-- Wave lines (background decoration) -->
  <g stroke="#00b4d8" stroke-width="0.5" fill="none" opacity="0.15">
    <path d="M0,200 Q150,180 300,200 T600,200 T900,200"/>
    <path d="M0,210 Q150,190 300,210 T600,210 T900,210"/>
    <path d="M0,220 Q150,200 300,220 T600,220 T900,220"/>
  </g>

  <!-- Orca silhouette (stylized) -->
  <g transform="translate(95, 60) scale(1.1)" filter="url(#shadow)">
    <!-- Main body -->
    <path d="
      M 80,120
      C 60,90  40,60  70,40
      C 90,28  120,25  140,30
      C 160,35  175,50  180,70
      L 200,60
      C 210,55  215,60  210,70
      L 185,80
      C 182,90  178,100  170,110
      C 180,120  185,135  175,150
      C 165,165  140,170  120,165
      C 100,160  85,145  80,130
      Z
    " fill="url(#orca-body)" stroke="#00b4d8" stroke-width="0.5" opacity="0.9"/>
    <!-- White belly patch -->
    <path d="
      M 95,130
      C 100,145  115,155  130,155
      C 145,155  155,148  158,138
      C 150,148  135,158  115,155
      C 100,152  92,142  95,130
      Z
    " fill="#e0f0ff" opacity="0.7"/>
    <!-- Eye -->
    <circle cx="130" cy="65" r="3" fill="#00e5ff"/>
    <!-- Dorsal fin -->
    <path d="M 130,30 C 125,15  135,5  140,10 C 145,15  138,28  135,30" fill="#1a1a2e" stroke="#00b4d8" stroke-width="0.3"/>
    <!-- Tail -->
    <path d="M 80,120 C 65,108  45,95  40,80 C 38,75  42,72  48,78 C 55,88  70,105  80,115" fill="#1a1a2e" stroke="#00b4d8" stroke-width="0.3"/>
    <!-- Pectoral fin -->
    <path d="M 115,100 C 105,115  95,125  88,120 C 82,115  90,105  105,98" fill="#1a1a2e" stroke="#00b4d8" stroke-width="0.3"/>
  </g>

  <!-- Accent line under orca -->
  <line x1="80" y1="210" x2="260" y2="210" stroke="url(#glow)" stroke-width="2"/>

  <!-- Title: ENVORCA -->
  <text x="310" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="8" fill="#ffffff" filter="url(#textglow)">ENVORCA</text>

  <!-- Tagline -->
  <text x="312" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#7ec8e3" letter-spacing="1">Linux development on Windows just work.</text>

  <!-- Subtle horizontal line -->
  <line x1="312" y1="180" x2="560" y2="180" stroke="#00b4d8" stroke-width="1" opacity="0.4"/>

  <!-- Tech badges -->
  <g font-family="'Segoe UI', monospace" font-size="11" fill="#4a8fa8" letter-spacing="0.5">
    <text x="312" y="200">Go</text>
    <text x="345" y="200">gRPC</text>
    <text x="395" y="200">WSL2</text>
    <text x="445" y="200">Docker</text>
    <text x="505" y="200">SQLite</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="294" width="900" height="6" fill="#00b4d8" opacity="0.6" rx="0"/>
</svg>